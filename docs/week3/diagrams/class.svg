ints="826,387 774,387 774,176 740,176" fill="none" stroke="#B7C9D9" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/><polyline points="420,175 375,175 375,308 197,308 197,337" fill="none" stroke="#B7C9D9" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="213" y="299" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="19" fill="#19334A" text-anchor="start" ><tspan x="213" dy="0">快照统计</tspan></text><text x="3" y="471" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="18" fill="#63778B" text-anchor="start" ><tspan x="3" dy="0">展示核心关系与代表字段，省略 Qt 事件、协议及辅助成员</tspan></text></g></svg>
