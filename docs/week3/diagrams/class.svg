<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="565" viewBox="0 0 1160 565"><rect width="1160" height="565" fill="#F7F9FC"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#63778B" stroke-width="1.5"/></marker></defs><text x="15" y="37" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="30" font-weight="bold" fill="#19334A">UML 核心类图</text><g transform="translate(0,60)"><rect x="420" y="5" width="320" height="210" rx="0" fill="#FFFFFF" stroke="#B7C9D9" stroke-width="1.5"/><text x="580" y="118.05" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="23" fill="#19334A" text-anchor="middle" ><tspan x="580" dy="0"></tspan></text><text x="580" y="37" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="24" fill="#19334A" text-anchor="middle" font-weight="bold"><tspan x="580" dy="0">Scheduler</tspan></text><polyline points="420,55 740,55" fill="none" stroke="#B7C9D9" stroke-width="2"  /><text x="438" y="86" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="20" fill="#19334A" text-anchor="start" ><tspan x="438" dy="0">- mutex_ : mutex</tspan><tspan x="438" dy="26">- jobs_ : vector&lt;Job&gt;</tspan></text><polyline points="420,144 740,144" fill="none" stroke="#B7C9D9" stroke-width="2"  /><text x="438" y="174" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="19" fill="#19334A" text-anchor="start" ><tspan x="438" dy="0">+ claim(policy, now) : Job?</tspan><tspan x="438" dy="24.7">+ cancel(id, now) : bool</tspan></text><rect x="20" y="5" width="315" height="210" rx="0" fill="#FFFFFF" stroke="#B7C9D9" stroke-width="1.5"/><text x="177.5" y="118.05" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="23" fill="#19334A" text-anchor="middle" ><tspan x="177.5" dy="0"></tspan></text><text x="177.5" y="37" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="24" fill="#19334A" text-anchor="middle" font-weight="bold"><tspan x="177.5" dy="0">Job</tspan></text><polyline points="20,55 335,55" fill="none" stroke="#B7C9D9" stroke-width="2"  /><text x="38" y="86" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="20" fill="#19334A" text-anchor="start" ><tspan x="38" dy="0">+ id : string</tspan><tspan x="38" dy="26">+ pages, copies, priority : int</tspan></text><polyline points="20,144 335,144" fill="none" stroke="#B7C9D9" stroke-width="2"  /><text x="38" y="174" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="19" fill="#19334A" text-anchor="start" ><tspan x="38" dy="0">+ sheets() : int</tspan></text><rect x="825" y="5" width="315" height="210" rx="0" fill="#FFFFFF" stroke="#B7C9D9" stroke-width="1.5"/><text x="982.5" y="118.05" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="23" fill="#19334A" text-anchor="middle" ><tspan x="982.5" dy="0"></tspan></text><text x="982.5" y="37" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="24" fill="#19334A" text-anchor="middle" font-weight="bold"><tspan x="982.5" dy="0">RunInterval</tspan></text><polyline points="825,55 1140,55" fill="none" stroke="#B7C9D9" stroke-width="2"  /><text x="843" y="86" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="20" fill="#19334A" text-anchor="start" ><tspan x="843" dy="0">startedMs : TimeMs</tspan><tspan x="843" dy="26">stoppedMs : optional&lt;TimeMs&gt;</tspan></text><polyline points="825,144 1140,144" fill="none" stroke="#B7C9D9" stroke-width="2"  /><text x="843" y="174" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="19" fill="#19334A" text-anchor="start" ><tspan x="843" dy="0">记录单次执行区间</tspan></text><rect x="50" y="337" width="295" height="100" rx="0" fill="#E9F0FA" stroke="#B7C9D9" stroke-width="1.5"/><text x="197.5" y="380.4" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="22" fill=