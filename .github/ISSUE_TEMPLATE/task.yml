name: 开发任务
description: 记录负责人、接口与验收条件
title: '[模块] 简述任务'
body:
  - type: dropdown
    id: owner
    attributes:
      label: 负责成员
      options: ['成员 A（@We1chan）：调度与统计', '成员 B（@YI1990442038）：进程与存储', '成员 C（@korwave）：界面与集成']
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 范围与接口
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收步骤
      placeholder: 写清输入、操作、预期结果，以及 Windows/macOS 验证方式。
    validations:
      required: true
