name: Cross-platform CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.os }} / Qt 6.10.2
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - name: Install build tools
        run: python -m pip install cmake==3.31.6 ninja==1.11.1.4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.2'
          cache: true
          archives: ${{ runner.os == 'Linux' && 'qtbase icu' || 'qtbase' }}
          cache-key-prefix: qt-with-linux-icu-v1
      - name: Install local PDF renderer
        run: python tools/setup_pdfium.py
      - name: Configure application
        run: cmake --preset ci
      - name: Build
        run: cmake --build --preset ci --parallel 2
      - name: Test
        run: ctest --preset ci
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Capture native desktop control scenarios
        if: runner.os != 'Linux'
        run: |
          python -c "from pathlib import Path; Path('runtime').mkdir(exist_ok=True)"
          ./build/ci/bin/gui_tests${{ runner.os == 'Windows' && '.exe' || '' }} editorialMotionRetargeting editorialAnimationFrameBudget editorialReceiptCodes editorialHoverSpreadsAndReturns editorialWindowChrome editorialDocumentPreview studentOrderPaymentAndForecast persistentPoliciesAndReport backendCrashDuringCancellation runningCancelFaultAndReconnect compactWindowKeepsControlsReachable -o runtime/native-gui-tests.txt,txt -o "-,txt"
        env:
          QT_QPA_PLATFORM: ${{ runner.os == 'Windows' && 'windows' || 'cocoa' }}
          CPS_GUI_EVIDENCE_DIR: ${{ github.workspace }}/runtime/native-gui-evidence
      - name: Deploy Qt runtime
        if: runner.os != 'Linux'
        run: python tools/package_app.py --bin-dir build/ci/bin --qt-bin "${{ env.QT_ROOT_DIR }}/bin" --output-dir dist/campus-print
      - name: Test deployed application without SDK paths
        if: runner.os != 'Linux'
        run: python tests/package_smoke.py --package-dir dist/campus-print
      - name: Upload desktop package
        if: runner.os != 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: campus-print-${{ runner.os }}
          path: |
            dist/*.zip
            dist/*.tar.gz
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence-${{ runner.os }}
          path: |
            build/ci/Testing/Temporary/
            build/ci/gui-results.xml
            runtime/native-gui-tests.txt
            runtime/native-gui-evidence/
  verify-desktop-package:
    name: Independent runtime / ${{ matrix.os }}
    needs: build-and-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: Windows
          - os: macos-latest
            artifact: macOS
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # This job never installs Qt, CMake or a compiler, and never builds the app.
      - uses: actions/download-artifact@v4
        with:
          name: campus-print-${{ matrix.artifact }}
          path: downloaded-package
      - name: Verify downloaded archive in independent runtime
        run: python tools/verify_package.py --archive-dir downloaded-package --output-dir runtime/independent
