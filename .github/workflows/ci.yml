name: Cross-platform CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.os }} / Qt 6.10.2
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - name: Install build tools
        run: python -m pip install cmake==3.31.6 ninja==1.11.1.4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.2'
          cache: true
          archives: qtbase
      - name: Configure
        run: cmake --preset ci
      - name: Build
        run: cmake --build --preset ci --parallel 2
      - name: Test
        run: ctest --preset ci
        env:
          QT_QPA_PLATFORM: offscreen
